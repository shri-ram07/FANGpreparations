name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Only contents:write is needed — we publish by pushing the built site to the
# gh-pages branch. The Pages *artifact* API needs admin rights the workflow
# token does not have, which is why this repo deploys from a branch instead.
permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # base must match the repo name — the site is served from /FANGpreparations/
      - run: npm run build
        env:
          BASE_PATH: /FANGpreparations/

      # GitHub Pages has no SPA rewrite: an unknown path serves 404.html.
      # Shipping index.html as 404.html lets react-router handle deep links.
      - run: cp dist/index.html dist/404.html

      # Stop Jekyll from swallowing files/dirs that begin with an underscore.
      - run: touch dist/.nojekyll

      - name: Publish dist to gh-pages
        working-directory: dist
        run: |
          git init -q -b gh-pages
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA:0:7}"
          git push -q --force \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
