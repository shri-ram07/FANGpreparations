name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a running deploy; queue instead.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # base must match the repo name — the site is served from /FANGpreparations/
      - run: npm run build
        env:
          BASE_PATH: /FANGpreparations/

      # GitHub Pages has no SPA rewrite: an unknown path serves 404.html.
      # Shipping index.html as 404.html lets react-router handle deep links.
      - run: cp dist/index.html dist/404.html

      # Stop Jekyll from swallowing files/dirs that begin with an underscore.
      - run: touch dist/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
